<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend connection diagnostics — ULPIN Atlas</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; padding: 28px 20px; }
        .wrap { max-width: 820px; margin: 0 auto; }
        h1 { font-size: 22px; font-weight: 800; }
        .sub { color: #7d9db5; font-size: 13px; margin-top: 6px; }
        .card { margin-top: 18px; border-radius: 14px; padding: 16px 18px; }
        .row { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(125,211,218,.1); align-items: flex-start; }
        .row:last-child { border-bottom: 0; }
        .badge { flex-shrink: 0; width: 74px; font-size: 10px; font-weight: 800; letter-spacing: .09em;
                 text-transform: uppercase; padding: 3px 0; text-align: center; border-radius: 5px; margin-top: 2px; }
        .b-run  { background: rgba(56,189,248,.16);  color: #7dd3fc; }
        .b-ok   { background: rgba(16,185,129,.16);  color: #6ee7b7; }
        .b-fail { background: rgba(244,63,94,.16);   color: #fda4af; }
        .b-warn { background: rgba(245,158,11,.14);  color: #fcd34d; }
        .rt { font-weight: 650; font-size: 14px; }
        .rd { color: #93b0c4; font-size: 12.5px; margin-top: 3px; line-height: 1.55; }
        code { font-family: ui-monospace, Menlo, monospace; background: rgba(255,255,255,.06);
               padding: 1.5px 6px; border-radius: 4px; font-size: 12px; word-break: break-all; }
        .verdict { margin-top: 20px; border-radius: 14px; padding: 18px; display: none; }
        .verdict h2 { font-size: 15px; font-weight: 800; margin-bottom: 9px; }
        .verdict ol { margin: 10px 0 0 19px; }
        .verdict li { margin-bottom: 7px; font-size: 13.5px; line-height: 1.6; }
        .v-bad  { background: rgba(244,63,94,.09);  border: 1px solid rgba(244,63,94,.3); }
        .v-good { background: rgba(16,185,129,.09); border: 1px solid rgba(16,185,129,.3); }
        button { margin-top: 20px; }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>Backend connection diagnostics</h1>
        <div class="sub">
            Runs the exact requests the app makes, from your browser, and reports precisely which step
            fails. Nothing here changes any setting.
        </div>

        <div class="card glass" id="results"></div>
        <div class="verdict" id="verdict"></div>

        <button class="btn-primary px-5 py-2.5 rounded-xl text-sm" onclick="location.reload()">Run again</button>
    </div>

    <script src="js/config.js"></script>
    <script>
        const R = document.getElementById('results');

        function row(title) {
            const el = document.createElement('div');
            el.className = 'row';
            el.innerHTML = `<span class="badge b-run">run</span>
                            <div><div class="rt">${title}</div><div class="rd">testing…</div></div>`;
            R.appendChild(el);
            return {
                set(state, detail) {
                    el.querySelector('.badge').className = 'badge b-' + state;
                    el.querySelector('.badge').textContent =
                        state === 'ok' ? 'pass' : state === 'fail' ? 'fail' : state === 'warn' ? 'warn' : 'run';
                    el.querySelector('.rd').innerHTML = detail;
                }
            };
        }

        const BASE = (window.API_BASE_URL || '').replace(/\/$/, '');
        let cause = null;

        (async () => {
            // 1 — configuration
            const r1 = row('API_BASE_URL is configured');
            if (!BASE) {
                r1.set('fail', 'Empty. <code>js/config.js</code> has no URL, so the app falls back to same-origin.');
                cause = 'noconfig';
            } else {
                r1.set('ok', `<code>${BASE}</code>`);
            }

            // 2 — page origin (what the backend must allow)
            const r2 = row('This page’s origin');
            r2.set('ok', `<code>${location.origin}</code> — this exact string must be in the backend’s
                          <code>ALLOWED_ORIGINS</code>, or that variable must be unset/<code>*</code>.`);

            // 3 — protocol mismatch
            const r3 = row('No mixed-content block');
            if (location.protocol === 'https:' && BASE.startsWith('http://')) {
                r3.set('fail', 'This page is <b>https</b> but the API is <b>http</b>. Browsers block that outright.');
                cause = cause || 'mixed';
            } else {
                r3.set('ok', 'Page and API protocols are compatible.');
            }

            if (!BASE) { finish(); return; }

            // 4 — no-cors reachability: succeeds even when CORS headers are absent,
            //     which separates "server unreachable" from "server blocked by CORS".
            const r4 = row('Server is reachable at all');
            let reachable = false;
            const t0 = Date.now();
            try {
                await fetch(BASE + '/health', { mode: 'no-cors', cache: 'no-store' });
                reachable = true;
                r4.set('ok', 'The server responded. (Opaque response — this check ignores CORS by design.)');
            } catch (e) {
                // A no-cors request cannot fail for CORS reasons, so an instant
                // rejection here means something local cancelled it.
                const instant = (Date.now() - t0) < 1500;
                r4.set('fail', `Could not reach the server: <code>${e.message}</code>${instant
                    ? '<br>It failed <b>instantly</b>, which is the signature of a browser extension or tracking prevention, not a slow server.'
                    : '. Either it is asleep/down, or the URL is wrong.'}`);
                cause = cause || (instant ? 'blocked' : 'unreachable');
            }

            // 5 — the real CORS-enforced request the app performs
            const r5 = row('CORS-enforced GET /health (what the app does)');
            let healthOk = false;
            try {
                const res = await fetch(BASE + '/health', { cache: 'no-store' });
                const body = await res.json();
                healthOk = body && body.status === 'ok';
                r5.set(healthOk ? 'ok' : 'warn',
                    `HTTP ${res.status} — <code>${JSON.stringify(body).slice(0, 150)}</code>`);
            } catch (e) {
                r5.set('fail',
                    `Blocked: <code>${e.message}</code>.<br>
                     Because step 4 ${reachable ? '<b>passed</b>, the server is up and this is a
                     <b>CORS rejection</b> — the browser refuses to let this page read the response'
                        : 'also failed, the server itself is unreachable'}.`);
                cause = cause || (reachable ? 'cors' : 'unreachable');
            }

            // 6 — preflight behaviour (only matters for POSTs now)
            const r6 = row('Preflight for POST requests');
            try {
                const res = await fetch(BASE + '/api/v1/generate-custom-ulpin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        country: 'IND', state_code: 'TN', district_code: '001',
                        city_code: 'CHE', plot_code: 'F03', unit_code: 'U301'
                    })
                });
                const body = await res.json();
                r6.set(res.ok ? 'ok' : 'warn',
                    `HTTP ${res.status} — <code>${JSON.stringify(body).slice(0, 120)}</code>`);
            } catch (e) {
                r6.set('fail', `Preflight or POST blocked: <code>${e.message}</code>.
                                Reads may work while writes fail if the origin is not allowed.`);
                cause = cause || 'cors';
            }

            finish(healthOk);
        })();

        function finish(healthOk) {
            const v = document.getElementById('verdict');
            v.style.display = 'block';

            if (healthOk && !cause) {
                v.className = 'verdict v-good';
                v.innerHTML = `<h2>Everything works — the backend is connected.</h2>
                    <div class="rd">If the app still shows “Browser mode”, hard-refresh it
                    (<b>Ctrl/Cmd + Shift + R</b>) so the browser drops its cached copy of the old scripts.</div>`;
                return;
            }

            v.className = 'verdict v-bad';
            const fixes = {
                cors: `<h2>Cause: CORS — the backend is not allowing this origin</h2>
                    <div class="rd">The server is running and replies to a direct visit, but it does not send
                    an <code>Access-Control-Allow-Origin</code> header for <code>${location.origin}</code>,
                    so the browser blocks the app from reading it.</div>
                    <ol>
                      <li>Render → your service → <b>Environment</b></li>
                      <li>Find <code>ALLOWED_ORIGINS</code>. Either <b>delete it</b> (it then defaults to
                          <code>*</code>) or set it to exactly <code>${location.origin}</code> —
                          origin only, no path, no trailing slash.</li>
                      <li><b>Manual Deploy → Deploy latest commit</b>, then re-run this page.</li>
                    </ol>`,
                blocked: `<h2>Cause: a browser extension or tracking prevention is blocking the request</h2>
                    <div class="rd">The request was cancelled <b>before it left the browser</b>
                    (<code>ERR_BLOCKED_BY_CLIENT</code>), so the server never saw it.
                    Your backend is almost certainly fine. Ad blockers and strict privacy modes often
                    flag unfamiliar API domains like <code>*.onrender.com</code>.</div>
                    <ol>
                      <li>Open this page in a <b>private/incognito window</b> with extensions disabled.
                          If it passes there, an extension is the cause.</li>
                      <li>Disable uBlock Origin / AdBlock / Privacy Badger / Ghostery for this site,
                          or allowlist <code>${BASE}</code>.</li>
                      <li>Edge: <b>Settings → Privacy, search, and services → Tracking prevention</b>.
                          Set it to <b>Basic</b>, or add this site under <b>Exceptions</b>.</li>
                    </ol>`,
                unreachable: `<h2>Cause: the server could not be reached</h2>
                    <ol>
                      <li>Open <code>${BASE}/health</code> directly. On Render’s free tier the first
                          request can take ~50 s to wake the service — let it finish, then re-run this page.</li>
                      <li>If it does not load at all, check the service is deployed and not suspended,
                          and that the URL in <code>js/config.js</code> matches Render exactly.</li>
                    </ol>`,
                mixed: `<h2>Cause: mixed content</h2>
                    <div class="rd">An <b>https</b> page cannot call an <b>http</b> API.
                    Use the <code>https://</code> form of the Render URL in <code>js/config.js</code>.</div>`,
                noconfig: `<h2>Cause: no API URL configured</h2>
                    <div class="rd">Set <code>API_BASE_URL</code> in <code>js/config.js</code>,
                    commit, and let Pages rebuild.</div>`,
            };
            v.innerHTML = fixes[cause] || fixes.cors;
        }
    </script>
</body>

</html>
